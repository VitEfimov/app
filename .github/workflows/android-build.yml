name: Android Build

on:
  push:
    branches:
      - main
      - master
      - nologin
      - optimization
      - task_flow
      - feature/freemium-strategy
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 🏗 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 📦 Fix Expo Dependencies
        run: npx expo install --fix

      - name: 🚀 Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Fix Gradle Version for SDK 51 Compatibility
        run: sed -i 's/gradle-8.8-all.zip/gradle-8.6-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: 🔨 Build APK
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleRelease

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
