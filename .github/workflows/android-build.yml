name: TaskCalendar Android Build

on:
  push:
    branches:
      - main
      - master
      - task_calendar
      - simpliest_v1
      - task_flow
      - free_v1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TaskCalendar APK
    runs-on: ubuntu-22.04
    
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 🏗 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 📦 Fix Expo Dependencies
        run: npx expo install --fix

      - name: 🚀 Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Fix Gradle Version for SDK 51 Compatibility
        run: sed -i 's/gradle-8.8-all.zip/gradle-8.6-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: 🐘 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build APK
        working-directory: ./android
        run: ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskcalendar-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
